name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-image0 \
            libxcb-xfixes0 libxcb-sync1 libxcb-xkb1 libxi6 libxrender1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check clammac tests packaging scripts

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v --cov=clammac --cov-report=term-missing

      - name: Check the interface starts and every page renders
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_interface.py -v

  manifest:
    name: Verify the pinned ClamAV manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Confirms the pinned digest still matches what upstream publishes, and
      # that ClamMac's extractor and run-path rewriter still understand the
      # package layout. If ClamAV changes how it builds its macOS package,
      # this is what tells us before a user finds out.
      - name: Verify pinned engine releases
        run: python scripts/verify-manifest.py

  icon:
    name: Build the application icon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1
      - run: python -m pip install PySide6
      - run: python packaging/build_app.py --icon-only
      - uses: actions/upload-artifact@v4
        with:
          name: icon
          path: clammac/resources/ClamMac.icns
