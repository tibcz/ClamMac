[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clammac"
version = "1.2.0"
description = "A native macOS antivirus application built around the ClamAV scanning engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "ClamMac contributors" }]
keywords = ["antivirus", "clamav", "macos", "security", "malware"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: MacOS X :: Cocoa",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = ["PySide6>=6.12,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
build = ["pyinstaller>=6.6"]

[project.urls]
Homepage = "https://github.com/tibcz/ClamMac"
Issues = "https://github.com/tibcz/ClamMac/issues"

[project.scripts]
clammac = "clammac.__main__:main"

[tool.setuptools.packages.find]
include = ["clammac*"]

[tool.setuptools.package-data]
clammac = ["resources/*.json", "resources/*.png", "resources/*.icns"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",    # line length is handled by the formatter, not enforced here
  "B008",    # Qt and dataclass idioms legitimately call in argument defaults
  "RUF012",  # dataclass-style mutable class attributes are used deliberately
  "UP042",   # str+Enum mixin is intentional: members compare equal to their
             # stored JSON values, which StrEnum only gained in 3.11 and which
             # keeps settings files readable and forward-compatible
  "SIM105",  # try/except/pass reads more plainly than contextlib.suppress in
             # the best-effort cleanup paths where it is used
  "SIM115",  # the two NamedTemporaryFile uses are deliberate: the file must
             # outlive the block so it can be atomically renamed into place
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
